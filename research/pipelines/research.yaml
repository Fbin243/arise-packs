description: Research every topic in its own child quest and keep the summaries as quest facts.
limits: { maxMinutes: 240 }
steps:
  - id: research
    uses: pipeline.call
    maxWait: 2h
    map: { over: facts.topics, maxParallel: 4 }
    with:
      pipeline: research-topic
      prompt: "{{ item }}"
      result: edit
  - id: record
    uses: facts.set
    needs: [research]
    with:
      values:
        summaries: "{{ steps.research.outputs.items }}"
